name: Fork icon checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tests/**'
      - '*.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/fork-icons.yml'

permissions:
  contents: read

concurrency:
  group: fork-icons-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;35.0.0' 'build-tools;36.1.0'
      - name: Verify baseline and archived host APIs
        run: |
          python3 tests/verify_runtime.py
          python3 tests/verify_target.py
          python3 tests/verify_test4_target.py
      - name: Run icon graphics, policies, import and Compose tests
        run: >-
          bash ./gradlew --no-daemon --console=plain --max-workers=2
          :app:testDebugUnitTest
          --tests 'dev.local.sunwindowdemo.features.iconlayers.*'
          --tests 'dev.local.sunwindowdemo.IconBatchUiTest'
      - name: Build unsigned R8 release
        run: >-
          bash ./gradlew --no-daemon --console=plain --max-workers=2
          -I tests/unsigned-ci.init.gradle :app:assembleRelease
      - name: Check retained hook names
        run: python3 tests/verify_r8_host_names.py app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fork-icon-test-results-${{ github.sha }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            verification/screenshots/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload unsigned build for signing
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NativeComplements-fork-UNSIGNED-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 14
